<div *ngIf="visible" class="popup-backdrop">
  <div class="popup-content">
    <h3>Fixer un entretien</h3>

    <div class="form-group">
      <label>Description :</label>
      <textarea [(ngModel)]="description" class="form-control" rows="3"></textarea>
    </div>

    <div class="form-group mt-2">
      <label>Date et heure :</label>
      <input type="datetime-local" [(ngModel)]="date" class="form-control">
    </div>

    <div class="mt-3 text-end">
      <button class="btn btn-secondary me-2" (click)="fermerPopup()">Annuler</button>
      <button class="btn btn-primary" (click)="envoyerEntretien()">Envoyer</button>
    </div>
  </div>
</div>
