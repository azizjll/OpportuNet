<div class="payment-container p-4 border rounded shadow-sm" style="max-width: 500px; margin: auto;">
  <h3 class="text-center mb-3">Paiement en ligne</h3>

  <p class="text-center mb-3">
    Montant à payer : <strong>{{ amount }} {{ currency }}</strong>
  </p>

  <!-- Carte Stripe -->
  <div id="card-element" class="border p-3 rounded mb-3"></div>

  <!-- Erreur -->
  <div *ngIf="errorMessage" class="text-danger mb-2">
    {{ errorMessage }}
  </div>

  <!-- Succès -->
  <div *ngIf="successMessage" class="text-success mb-2">
    {{ successMessage }}
  </div>

  <!-- Bouton -->
  <button class="btn btn-primary w-100" (click)="pay()" [disabled]="processing">
    {{ processing ? 'Traitement...' : 'Payer' }}
  </button>
</div>
