<div class="container d-flex justify-content-center mt-5">
  <div class="card p-4" style="width: 1000px;">
    <h3 class="text-center mb-4">Gestion des Packets</h3>

    <!-- Formulaire d'ajout -->
    <div class="mb-3">
      <input type="text" [(ngModel)]="newPacket.name" placeholder="Nom du packet" class="form-control mb-2">
      <input type="text" [(ngModel)]="newPacket.description" placeholder="Description" class="form-control mb-2">
      <input type="number" [(ngModel)]="newPacket.price" placeholder="Prix" class="form-control mb-2">
      <input type="text" [(ngModel)]="newPacket.currency" placeholder="Devise (ex: USD, EUR)" class="form-control mb-2">
      <button (click)="addPacket()" class="btn btn-primary w-100">Ajouter Packet</button>
    </div>

    <!-- Liste des packets -->
    <div *ngIf="loading" class="text-center">Chargement...</div>

    <table class="table table-bordered table-sm" *ngIf="!loading">
      <thead>
        <tr>
          <th>Nom</th>
          <th>Description</th>
          <th>Prix</th>
          <th>Devise</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let packet of packets">
          <!-- Affichage normal -->
          <ng-container *ngIf="editingPacketId !== packet.id; else editTemplate">
            <td>{{ packet.name }}</td>
            <td>{{ packet.description }}</td>
            <td>{{ packet.price }}</td>
            <td>{{ packet.currency }}</td>
            <td>
              <button class="btn btn-sm btn-warning me-2" (click)="startEdit(packet)">Modifier</button>
              <button class="btn btn-sm btn-danger" (click)="removePacket(packet.id)">Supprimer</button>
            </td>
          </ng-container>

          <!-- Template d'édition -->
          <ng-template #editTemplate>
            <td><input [(ngModel)]="editedPacket.name" class="form-control form-control-sm"></td>
            <td><input [(ngModel)]="editedPacket.description" class="form-control form-control-sm"></td>
            <td><input type="number" [(ngModel)]="editedPacket.price" class="form-control form-control-sm"></td>
            <td><input [(ngModel)]="editedPacket.currency" class="form-control form-control-sm"></td>
            <td>
              <button class="btn btn-sm btn-success me-2" (click)="saveEdit()">Sauvegarder</button>
              <button class="btn btn-sm btn-secondary" (click)="cancelEdit()">Annuler</button>
            </td>
          </ng-template>
        </tr>
      </tbody>
    </table>
  </div>
</div>
